<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <!-- <link rel="stylesheet" href="totaliseur.css"> -->
    <script src="onscreen-keyboard.js"></script>
    <script src="totaliseur.js"></script>
    <title>Totalisateur</title>
    <link rel="manifest" href="manifest.json">
</head>

<body class="text-center font-mono text-lg">
    <header
        class="group relative right-0 h-[6vmax] py-1 bg-yellow-400 text-center *:h-full landscape:fixed landscape:w-1/2">
        <input type="text" id="cart_total" class="currency w-28" value="0.00" readonly>
        <button class="invisible absolute left-1 top-0 group-focus-within:visible"></button>
    </header>
    <div id="cart_items" class="h-[74vmax] overflow-y-scroll landscape:h-screen landscape:w-1/2">
        <script>
            Numboard.init();
            Numboard.clearBtn.innerHTML = createIconHTML("delete");
            Histo.retrieve();
            Numboard.cartItems.addEventListener('revised', Histo.save);
        </script>
    </div>
    <footer class="bottom-0 right-0 h-[20vmax] py-1 landscape:fixed landscape:w-1/2">
        <script>
            Keyboard.functionKeyHandler = Numboard.addItemHandler;
            Keyboard.init('#cart_items');
        </script>
    </footer>
</body>

</html>
